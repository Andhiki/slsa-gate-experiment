name: Build synthetic provenance fixture
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Synthetic fixture marker
        type: choice
        options: [legitimate, alternative, unsigned]
        default: legitimate
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ inputs.fixture }}-${{ github.run_id }}
          build-args: FIXTURE=${{ inputs.fixture }}
      - name: Generate GitHub SLSA attestation
        if: inputs.fixture != 'unsigned'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record public fixture identifiers
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          FIXTURE: ${{ inputs.fixture }}
        run: |
          printf 'fixture=%s\nimage=%s@%s\n' "$FIXTURE" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
