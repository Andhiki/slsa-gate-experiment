name: npm install policy feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm install --prefix /tmp/npm-pilot-cli npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - run: python3 npm_pilot.py selfcheck && python3 npm_pilot.py sentinel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: npm-controls
          path: results/npm/
          retention-days: 14
  integrations:
    needs: controls
    strategy:
      fail-fast: false
      matrix:
        case: [lodash, esbuild, sharp, bcrypt, canvas]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm install --prefix /tmp/npm-pilot-cli npm@12.2.1 --ignore-scripts --no-audit --no-fund
      - run: python3 npm_pilot.py ${{ matrix.case }}
      - name: Preserve bounded evidence
        if: always()
        run: find results -type d -name node_modules -prune -exec rm -rf {} +
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: npm-${{ matrix.case }}
          path: results/npm/
          retention-days: 14
