name: Focused metadata cache causality proof
on:
  workflow_dispatch:
    inputs:
      sessions:
        description: Independent fresh-cluster sessions (1 or 3)
        default: '3'
permissions:
  contents: read
jobs:
  cache:
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.sessions == '3' && '[20261021,20261022,20261023]' || '[20261021]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Instrument checks and record host
        run: |
          mkdir -p results
          python3 check_fault_proxy.py
          python3 check_policies.py
          python3 check_cache_analyze.py
          python3 -c 'import metadata_proof; metadata_proof.self_check()'
          { date -u; uname -a; lscpu; free -b; df -h /; python3 --version; gh --version; docker version; helm version; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"; } > results/environment.txt 2>&1
          git rev-parse HEAD > results/source-commit.txt
      - name: Install pinned clients and fresh cluster
        run: |
          curl -fLsS https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl -o /tmp/kubectl
          curl -fLsS https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256 -o /tmp/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          chmod +x /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          curl -fLsS https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o /tmp/kind
          curl -fLsS https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum -o /tmp/kind.sha256sum
          echo "$(cut -d ' ' -f 1 /tmp/kind.sha256sum)  /tmp/kind" | sha256sum --check
          chmod +x /tmp/kind
          /tmp/kind create cluster --name slsa-gate --image kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a --kubeconfig /tmp/slsa-kubeconfig --wait 120s
          kubectl --kubeconfig /tmp/slsa-kubeconfig create namespace slsa-experiment
          kubectl --kubeconfig /tmp/slsa-kubeconfig create namespace kyverno
          kubectl --kubeconfig /tmp/slsa-kubeconfig create configmap fault-proxy-source -n kyverno --from-file=fault_proxy.py
          kubectl --kubeconfig /tmp/slsa-kubeconfig apply -f fault-proxy.yaml
          kubectl --kubeconfig /tmp/slsa-kubeconfig rollout status deploy/fault-proxy -n kyverno --timeout=120s
          helm repo add kyverno https://kyverno.github.io/kyverno/
          helm upgrade --install kyverno kyverno/kyverno --version 3.9.1 --namespace kyverno --kubeconfig /tmp/slsa-kubeconfig --values kyverno-values.yaml --values cache-values.yaml --values metadata-proof-values.yaml --wait --timeout 180s
          kubectl --kubeconfig /tmp/slsa-kubeconfig version -o json > results/kubernetes-version.json
          kubectl --kubeconfig /tmp/slsa-kubeconfig get deployment kyverno-admission-controller -n kyverno -o json > results/controller-deployment.json
      - name: Run predeclared matched-age metadata check
        env:
          SEED: ${{ matrix.seed }}
          CACHE_TTL_SECONDS: '120'
          RUN_ID: metadata-proof-${{ github.run_id }}-${{ matrix.seed }}
        run: python3 metadata_proof.py
      - name: Preserve diagnostics
        if: always()
        run: |
          kubectl --kubeconfig /tmp/slsa-kubeconfig get pods -A -o wide > results/pods.txt 2>&1 || true
          kubectl --kubeconfig /tmp/slsa-kubeconfig get events -A > results/events.txt 2>&1 || true
          kubectl --kubeconfig /tmp/slsa-kubeconfig logs -n kyverno -l app.kubernetes.io/component=admission-controller --all-containers --tail=1000 > results/controller.log 2>&1 || true
          kubectl --kubeconfig /tmp/slsa-kubeconfig logs -n kyverno deployment/fault-proxy > results/fault-proxy.log 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metadata-proof-evidence-${{ matrix.seed }}
          path: results/
          retention-days: 30
